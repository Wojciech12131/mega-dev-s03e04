<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="6cb4a5627b2e10f2e7632c61d55748a80fd8b644" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css?v=6cb4a5627b2e10f2e7632c61d55748a80fd8b644" />
    <script type="module" src="app.js?v=6cb4a5627b2e10f2e7632c61d55748a80fd8b644"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight · <span id="status" role="status" aria-live="polite">loading…</span></p>
    </header>
    <main data-testid="board">
      <div class="col">
        <div data-testid="loader" class="loader" role="status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span> Loading incidents…
        </div>
        <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
        <ul data-testid="incident-list" class="list" hidden></ul>
      </div>
      <div class="side">
        <p id="panel-hint" class="panel-hint">Pick an incident to open it. Ack is in its panel.</p>
        <aside id="incident-panel" data-testid="incident-panel" class="panel" aria-label="Incident" hidden>
          <button type="button" class="panel-close" aria-label="Close">×</button>
          <h2 class="panel-id"></h2>
          <p class="panel-what"></p>
          <p class="panel-meta"><span class="panel-sev"></span> · opened <time class="panel-time"></time></p>
          <button type="button" data-testid="panel-ack" class="panel-ack">Ack</button>
          <p class="panel-acked acked" hidden></p>
        </aside>
      </div>
    </main>
    <footer>sched-prod incident board · build <code data-testid="build-sha">6cb4a5627b2e10f2e7632c61d55748a80fd8b644</code></footer>
  </body>
</html>
